<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deluxe Media Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col font-space selection:bg-[#22c55e] selection:text-black p-6 space-y-6">

   
    <header class="w-fit border border-zinc-800 bg-[#0a0a0a] rounded-xl px-5 py-2.5 flex items-center space-x-3">
        <span class="h-2.5 w-2.5 rounded-full bg-[#22c55e] animate-pulse"></span>
        <span class="font-bold tracking-tight text-sm text-white uppercase">DELUXE <span class="text-[#22c55e]">MEDIA CONVERTER</span></span>
    </header>

    
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
        
       
        <div id="drop-zone" class="lg:col-span-8 border border-zinc-800 rounded-2xl bg-[#0a0a0a] hover:border-[#22c55e]/60 transition-all cursor-pointer p-8 flex flex-col items-center justify-center min-h-[320px] relative group">
            <input type="file" id="file-input" accept="audio/*,video/*,image/*" class="hidden">
            <label for="file-input" class="cursor-pointer flex flex-col items-center text-center space-y-3">
                <div class="w-12 h-12 rounded-full border border-zinc-700/80 bg-zinc-900 flex items-center justify-center text-zinc-400 group-hover:border-[#22c55e] group-hover:text-[#22c55e] transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                </div>
                <div>
                    <span id="file-label" class="text-base text-zinc-200 font-medium block">drag and drop here or browse here</span>
                    <span id="file-sublabel" class="text-xs text-zinc-500 font-mono mt-1 block">Supports MP3, WAV, OGG, AAC, MP4, WebM & Images</span>
                </div>
            </label>
        </div>

        
        <div class="lg:col-span-4 border border-zinc-800 rounded-2xl bg-[#0a0a0a] p-6 flex flex-col justify-between space-y-6">
            <div class="space-y-4">
                <span class="text-xs font-mono uppercase tracking-wider text-zinc-400 block border-b border-zinc-800 pb-2">selection area</span>
                
                
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-2">Target Conversion Format</label>
                    <select id="target-format" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#22c55e] font-mono">
                        
                    </select>
                </div>

               
                <div class="space-y-2 pt-2">
                    <label class="block text-xs font-mono text-zinc-400">Processing Mode</label>
                    <div class="grid grid-cols-1 gap-2 font-mono text-xs">
                        <button id="mode-audio-btn" onclick="switchMode('audio')" class="w-full text-left px-3 py-2.5 rounded-lg border border-[#22c55e] text-[#22c55e] bg-[#22c55e]/5 transition-all">Audio Converter</button>
                        <button id="mode-vid2gif-btn" onclick="switchMode('vid2gif')" class="w-full text-left px-3 py-2.5 rounded-lg border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition-all">Video / Clip Converter</button>
                        <button id="mode-extract-btn" onclick="switchMode('extract')" class="w-full text-left px-3 py-2.5 rounded-lg border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition-all">Extract Audio Stream</button>
                    </div>
                </div>
            </div>

            
            <button id="process-btn" onclick="executeMediaConversion()" class="w-full bg-[#22c55e] hover:bg-[#16a34a] text-black font-bold py-3.5 rounded-xl transition-all text-xs uppercase tracking-wider">
                Start Conversion
            </button>
        </div>

    </section>

    
    <section class="border border-zinc-800 rounded-2xl bg-[#0a0a0a] p-6 flex flex-col lg:flex-row items-center gap-6">
        
        
        <div class="w-32 h-20 border border-zinc-800 rounded-xl bg-black flex items-center justify-center overflow-hidden shrink-0">
            <video id="video-preview" controls class="hidden w-full h-full object-cover"></video>
            <audio id="audio-preview" controls class="hidden w-full px-2"></audio>
            <div id="preview-placeholder" class="text-[10px] font-mono text-zinc-600 uppercase text-center px-2">No Preview</div>
        </div>

        
        <div class="flex-1 w-full space-y-3">
            <div class="flex justify-between items-center text-xs font-mono">
                <span id="showcase-title" class="text-zinc-300">Conversion of the provided file will be shown here</span>
                <span id="status-text" class="text-[#22c55e]">Idle</span>
            </div>

            
            <div class="w-full bg-black border border-zinc-800 rounded-full h-3 overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-[#22c55e] h-full rounded-full transition-all duration-200" style="width: 0%;"></div>
            </div>

            
            <div class="flex justify-between items-center">
                <div class="border border-zinc-800 rounded-lg px-3 py-1 bg-black text-[11px] font-mono text-zinc-400">
                    <span id="time-left">time left</span>
                </div>
                <span id="meta-info" class="text-[11px] font-mono text-zinc-500">0 MB</span>
            </div>
        </div>

    </section>

    
    <footer class="flex justify-center pt-2">
        <div class="border border-zinc-800 rounded-xl px-8 py-2 bg-[#0a0a0a] text-xs font-mono text-zinc-500">
            Deluxe Media Converter v1.0
        </div>
    </footer>

    <script src="static/js/main.js"></script>
    <script src="static/js/media-ops.js"></script>
</body>
</html>
